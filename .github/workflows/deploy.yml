# Deploys the static export to GitHub Pages automatically.
# Works in any account / repo: the base path is derived from your repo name.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # basePath makes asset URLs work at /<owner>/<repo>/ on Pages
      - run: npm run export
        env:
          npm_package_basePath: "/${{ github.event.repository.name }}"
      # .nojekyll disables Jekyll so dot-prefixed assets aren't skipped
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
